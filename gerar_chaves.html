<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração - Gerar Chaves PGP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/openpgp/dist/openpgp.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 600px;
            margin-top: 50px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Setup de Segurança (Fabricante)</h4>
            </div>
            <div class="card-body text-center">
                <p>Para que o sistema funcione, precisamos gerar o par de chaves PGP que o fabricante usará para assinar
                    os medicamentos.</p>
                <button id="btn-generate" class="btn btn-success btn-lg">Gerar Par de Chaves PGP</button>
                <div id="status" class="mt-3"></div>
                <div class="mt-4 text-start" id="keys-display" style="display:none;">
                    <h5>Chave Pública:</h5>
                    <textarea class="form-control" id="pub-key" rows="5" readonly></textarea>
                    <a href="index.php" class="btn btn-primary mt-3">Ir para o Início</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('btn-generate').addEventListener('click', async () => {
            const btn = document.getElementById('btn-generate');
            const status = document.getElementById('status');
            btn.disabled = true;
            btn.innerText = 'Gerando chaves... (Isso pode demorar alguns segundos)';

            try {
                // Generate keys
                const { privateKey, publicKey } = await openpgp.generateKey({
                    type: 'rsa',
                    rsaBits: 2048,
                    userIDs: [{ name: 'Fabricante de Medicamentos TCC', email: 'fabricante@tcc.com' }]
                });

                // Send to backend to save
                const response = await fetch('api/setup_chaves.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ publicKey, privateKey })
                });

                const result = await response.json();

                if (result.success) {
                    status.innerHTML = `<div class="alert alert-success">${result.message}</div>`;
                    document.getElementById('keys-display').style.display = 'block';
                    document.getElementById('pub-key').value = publicKey;
                } else {
                    status.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
                    btn.disabled = false;
                    btn.innerText = 'Tentar Novamente';
                }
            } catch (e) {
                status.innerHTML = `<div class="alert alert-danger">Erro ao gerar chaves: ${e.message}</div>`;
                btn.disabled = false;
                btn.innerText = 'Tentar Novamente';
            }
        });
    </script>
</body>

</html>
